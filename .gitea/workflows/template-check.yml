name: subcult-os-check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: subcult_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: subcult_test
        options: >-
          --health-cmd "pg_isready -U subcult_test -d subcult_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.33.0'
          run_install: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Report toolchain
        run: |
          node --version
          pnpm --version
          go version
          docker compose version
      - name: Verify subcult-os baseline
        run: make verify
      - name: Verify persisted lifecycle and protocol boundaries
        env:
          TEST_POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          # The runner may use a shared network: the generic postgres alias
          # can resolve to another job or a retained database. Use only this
          # job's exact service container and fail closed if it is unavailable.
          test -n "$TEST_POSTGRES_ID"
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$TEST_POSTGRES_ID")
          if ! [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Expected exactly one IPv4 address for the job database' >&2
            exit 1
          fi
          export TEST_DATABASE_URL="postgres://subcult_test:disposable-ci-only@$test_db_ip:5432/subcult_test?sslmode=disable"
          make test-db
