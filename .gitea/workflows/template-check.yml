name: subcult-os-check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: subcult_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: subcult_test
        options: >-
          --health-cmd "pg_isready -U subcult_test -d subcult_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.33.0'
          run_install: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Report toolchain
        run: |
          node --version
          pnpm --version
          go version
          docker compose version
      - name: Verify subcult-os baseline
        run: make verify
      - name: Verify persisted lifecycle and protocol boundaries
        env:
          TEST_DATABASE_URL: postgres://subcult_test:disposable-ci-only@postgres:5432/subcult_test?sslmode=disable
        run: make test-db
