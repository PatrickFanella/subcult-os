name: ${COMPOSE_PROJECT_NAME:-subcult-os}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://app:change-me@postgres:5432/app?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres-data:
